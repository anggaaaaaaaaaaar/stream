name: Release

# Builds and publishes a signed stable release when a tag like v4.9.1 is pushed.
# Like pre-release, this may run on a self-hosted runner, so keep it limited to
# tag pushes on this repository. Never add pull_request or comment triggers.
on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: "release"
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.repository == 'anggaaaaaaaaaaar/stream-base' && startsWith(github.ref, 'refs/tags/v')
    # Set the RELEASE_RUNNER repository variable to your runner's label (e.g. "minipc")
    # to build on your own machine. Defaults to a GitHub-hosted runner.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The in-app updater compares the APK name with the installed versionName,
    # so the tag has to match versionName in gradle/libs.versions.toml.
    - name: Check tag matches versionName
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DECLARED="$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
        if [ "${VERSION}" != "${DECLARED}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${DECLARED} in gradle/libs.versions.toml."
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Write keystore
      id: fetch_keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ]; then
          echo "::error::Set the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets."
          exit 1
        fi
        KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
        mkdir -p "${KEYSTORE_DIR}"
        chmod 700 "${KEYSTORE_DIR}"
        echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_DIR}/release.keystore"
        echo "store_file=${KEYSTORE_DIR}/release.keystore" >> "$GITHUB_OUTPUT"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    # Self-hosted runners keep Gradle and Kotlin daemons between jobs. A daemon left over
    # from a cancelled run is shared with the next build and can run it out of heap, so
    # stop old daemons and compile Kotlin inside a single, short-lived Gradle process.
    - name: Stop leftover Gradle daemons
      run: |
        ./gradlew --stop || true
        pkill -u "$(id -u)" -f KotlinCompileDaemon || true

    - name: Run Gradle
      run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process assembleStableRelease
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'key0' }}
        SIGNING_STORE_FILE: ${{ steps.fetch_keystore.outputs.store_file }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Remove keystore
      if: always()
      run: rm -rf "${RUNNER_TEMP}/keystore"

    # Uses the gh CLI instead of a third-party action, so no outside code
    # touches the release token. A self-hosted runner needs gh installed.
    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        APK="CineVault-${VERSION}.apk"
        cp app/build/outputs/apk/stable/release/*.apk "${APK}"
        gh release create "${GITHUB_REF_NAME}" \
          --verify-tag \
          --title "CineVault ${VERSION}" \
          --generate-notes \
          "${APK}"
